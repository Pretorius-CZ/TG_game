name: Browser layout checks
on:
  workflow_dispatch:
  push:
    branches: [codex/cockpit-stage]
    paths: ['src/**', 'tests/browser/**', 'playwright.config.js', 'package*.json', '.github/workflows/browser-layout.yml']
  pull_request:
    paths: ['src/**', 'tests/browser/**', 'playwright.config.js', 'package*.json', '.github/workflows/browser-layout.yml']
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-layout-results
          path: .local/browser-results
          include-hidden-files: true
