apply plugin: 'com.android.application'

def admobUnits = new groovy.json.JsonSlurper().parse(rootProject.file('../src/androidAdUnits.json'))
def internalTestRelease = providers.gradleProperty('internalTestRelease').orNull == 'true'
def uploadProperties = new Properties()
def uploadPropertiesFile = rootProject.file('key.properties')
if (uploadPropertiesFile.exists()) uploadPropertiesFile.withInputStream { uploadProperties.load(it) }

android {
    namespace = "com.playbeyondthesignal.game"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.playbeyondthesignal.game"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "0.1.0-internal.3"
        manifestPlaceholders = [admobApplicationId: admobUnits.test.applicationId]
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        upload {
            if (uploadPropertiesFile.exists()) {
                storeFile rootProject.file(uploadProperties.getProperty('storeFile'))
                storePassword uploadProperties.getProperty('storePassword')
                keyAlias uploadProperties.getProperty('keyAlias')
                keyPassword uploadProperties.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        debug {
            applicationIdSuffix ".preview"
            // Load this app's published UMP message while retaining the demo rewarded unit.
            manifestPlaceholders = [admobApplicationId: admobUnits.production.applicationId]
        }
        release {
            signingConfig signingConfigs.upload
            manifestPlaceholders = [admobApplicationId: admobUnits.production.applicationId]
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}

// Explicit opt-in permits signed internal testing, never a production ad switch.
gradle.taskGraph.whenReady { graph ->
    if (graph.allTasks.any { it.name.toLowerCase().contains('release') }) {
        if (!internalTestRelease) throw new GradleException('Release blocked. Use npm run android:aab for the signed INTERNAL TEST bundle with demo ads. Public release still needs Families, privacy and device QA review.')
        if (!uploadPropertiesFile.exists()) throw new GradleException('Missing local android/key.properties. See docs/google-play/internal-testing.md.')
    }
}
